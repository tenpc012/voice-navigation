<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>403 Access Denied / 存取限制</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-top: 4px solid #ef4444;
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    .subtitle-en {
      font-size: 14px;
      font-weight: 600;
      color: #ef4444;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .divider {
      height: 1px;
      background-color: #1f2937;
      margin: 20px 0;
    }
    .message-zh {
      font-size: 15px;
      color: #e2e8f0;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .message-en {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.5;
    }
    .status-box {
      margin-top: 28px;
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      background-color: #030712;
      color: #f59e0b;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #374151;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🚫</div>
    <h1>這邊什麼都沒有！！</h1>
    <div class="subtitle-en">ACCESS DENIED / DIRECTORY PROTECTED</div>

    <div class="message-zh">
      此目錄未開放外部存取，亦未放置任何公開檔案。<br>
      未經授權的存取嘗試將會被系統日誌（System Log）記錄。
    </div>

    <div class="divider"></div>

    <div class="message-en">
      There is nothing here. Public browsing of this directory is strictly prohibited.<br>
      Unauthorized access or probing attempts will be logged and monitored.
    </div>

    <div class="status-box">
      HTTP 403 FORBIDDEN • SYSTEM WARNING
    </div>
  </div>

</body>
</html>
