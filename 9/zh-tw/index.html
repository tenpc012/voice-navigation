<html lang="zh-Hant-TW">

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
		
	<!-- Google tag (gtag.js) -->

<body>

	<!-- 垂直排列的核心外框容器 -->
	<div class="middle-layout">

    <!-- 1. 上區塊：影片標題 -->
    <div class="c-title">
      <p id="title-text">載入標題中...</p>
    </div>

    <!-- 2. 中區塊：播放器主體 -->
  <div class="player-card">
    <audio id="audioPlayer" src="https://archive.org/serve/9._20260812/9.%20%E4%B8%AD%E6%96%87%20%E7%B3%96%E8%9C%9C%E4%B8%89%E9%80%A3%E7%BD%90-%E7%8D%B8%E9%AA%A8%E7%A5%AD%E5%A3%87.mp3" preload="metadata"></audio>

    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" title="倒退 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="btn btn-play-main" id="playBtn" title="播放/暫停">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn" id="nextBtn" title="快進 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

<!-- 3. 下區塊：影片內容介紹 -->
    <div class="c-intro">
		<p id="intro-text">載入簡介中...</p>
    </div>

  </div>
