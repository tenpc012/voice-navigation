<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暖金色聲波音樂播放器</title>
  <style>
    /* 全域變數定義：色調完全比照圖片中的奶茶金/駝色風格 */
    :root {
      --main-color: #D3B28C;       /* 主配色：柔和奶茶金 */
      --accent-color: #BE9B73;     /* 深一點的按鈕色 */
      --light-color: #F8F4EE;      /* 播放器背景/點綴亮色 */
      --track-bg: #EADBC8;         /* 進度條底色 */
      --bg-gradient: linear-gradient(135deg, #fbf9f5 0%, #e6dec3 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    /* 播放器主要外盒 */
    .player-container {
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(185, 150, 110, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 1. 頂部聲波圖案 (Waveform) */
    .waveform-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      height: 45px;
      gap: 3px;
      padding: 0 5px;
    }

    .wave-bar {
      flex: 1;
      background-color: var(--main-color);
      border-radius: 3px;
      opacity: 0.85;
      transition: height 0.3s ease;
    }

    /* 2. 進度條 (Progress Bar) */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--track-bg);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }

    .progress-bar-fill {
      width: 32%; /* 範例播放進度 */
      height: 100%;
      background-color: var(--main-color);
      border-radius: 10px;
      position: relative;
    }

    .progress-bar-handle {
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      background-color: var(--main-color);
      border: 3px solid var(--light-color);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    /* 3. 控制按鈕組 (Controls) */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 10px 0 10px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.1);
      color: #9E7B54;
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 中間圓形主播放鍵 */
    .btn-play-main {
      width: 58px;
      height: 58px;
      background-color: var(--main-color);
      color: var(--light-color);
      border-radius: 50%;
      box-shadow: 0 6px 15px rgba(190, 155, 115, 0.4);
    }

    .btn-play-main:hover {
      background-color: var(--accent-color);
      color: #FFF;
      transform: scale(1.06);
    }

    .btn-play-main svg {
      width: 26px;
      height: 26px;
      margin-left: 3px; /* 視覺置中 */
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="player-container">
    
    <!-- 1. 聲波區域 (透過簡短 inline CSS 模擬圖中高低起伏的頻譜) -->
    <div class="waveform-container">
      <div class="wave-bar" style="height: 40%;"></div>
      <div class="wave-bar" style="height: 65%;"></div>
      <div class="wave-bar" style="height: 80%;"></div>
      <div class="wave-bar" style="height: 95%;"></div>
      <div class="wave-bar" style="height: 50%;"></div>
      <div class="wave-bar" style="height: 70%;"></div>
      <div class="wave-bar" style="height: 35%;"></div>
      <div class="wave-bar" style="height: 60%;"></div>
      <div class="wave-bar" style="height: 85%;"></div>
      <div class="wave-bar" style="height: 75%;"></div>
      <div class="wave-bar" style="height: 45%;"></div>
      <div class="wave-bar" style="height: 90%;"></div>
      <div class="wave-bar" style="height: 60%;"></div>
      <div class="wave-bar" style="height: 30%;"></div>
      <div class="wave-bar" style="height: 55%;"></div>
      <div class="wave-bar" style="height: 70%;"></div>
      <div class="wave-bar" style="height: 100%;"></div>
      <div class="wave-bar" style="height: 80%;"></div>
      <div class="wave-bar" style="height: 65%;"></div>
      <div class="wave-bar" style="height: 45%;"></div>
      <div class="wave-bar" style="height: 75%;"></div>
      <div class="wave-bar" style="height: 60%;"></div>
      <div class="wave-bar" style="height: 80%;"></div>
      <div class="wave-bar" style="height: 50%;"></div>
      <div class="wave-bar" style="height: 35%;"></div>
      <div class="wave-bar" style="height: 70%;"></div>
      <div class="wave-bar" style="height: 90%;"></div>
      <div class="wave-bar" style="height: 65%;"></div>
      <div class="wave-bar" style="height: 80%;"></div>
    </div>

    <!-- 2. 進度條區域 -->
    <div class="progress-container">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill">
          <div class="progress-bar-handle"></div>
        </div>
      </div>
    </div>

    <!-- 3. 五大控制按鈕組 (從左到右完全對應圖片) -->
    <div class="controls">
      <!-- 隨機播放 (Shuffle) -->
      <button class="btn" title="隨機播放">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <!-- 上一首 (Previous) -->
      <button class="btn" title="上一首">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- 播放 (Play) - 主按鈕 -->
      <button class="btn btn-play-main" title="播放">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- 下一首 (Next) -->
      <button class="btn" title="下一首">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <!-- 循環播放 (Repeat) -->
      <button class="btn" title="循環播放">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

  </div>

</body>
</html>
