<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十鼓導覽 - 暗金流光奇幻播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0a0e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    /* 🔮 奇幻膠囊外框 + 暗金色閃爍光芒 */
    .player-card {
      width: 100%;
      max-width: 380px;
      background: 
        radial-gradient(circle at 30% 30%, rgba(180, 140, 60, 0.15), transparent 60%),
        linear-gradient(135deg, #16121e 0%, #1a1426 50%, #15100c 100%);
      
      border-radius: 32px;
      padding: 24px 28px 20px 28px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      
      /* 套用暗金呼吸光芒動畫 */
      animation: darkGoldGlow 4s infinite ease-in-out alternate;
      
      display: flex;
      flex-direction: column;
      gap: 22px;
      backdrop-filter: blur(8px);
    }

    /* 🌟 暗金色光茫動態關鍵幀 (Glow Keyframes) */
    @keyframes darkGoldGlow {
      0% {
        box-shadow: 
          0 10px 25px rgba(0, 0, 0, 0.7),
          0 0 12px rgba(180, 136, 42, 0.25),
          inset 0 0 10px rgba(180, 136, 42, 0.15);
        border-color: rgba(212, 175, 55, 0.3);
      }
      100% {
        box-shadow: 
          0 12px 35px rgba(0, 0, 0, 0.8),
          0 0 28px rgba(212, 175, 55, 0.55),
          inset 0 0 18px rgba(212, 175, 55, 0.3);
        border-color: rgba(255, 215, 0, 0.75);
      }
    }

    /* 頂部極細進度條 */
    .progress-area {
      width: 100%;
      cursor: pointer;
      padding: 6px 0;
    }

    .progress-bar-bg {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9b51e0, #d4af37);
      border-radius: 2px;
      position: relative;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    .progress-handle {
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      background-color: #fff8e7;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.9);
    }

    /* 控制按鈕列 */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 0 16px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #dfd5e8;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: all 0.25s ease;
    }

    .btn:hover {
      opacity: 1;
      color: #ffd700;
      transform: scale(1.12);
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 中間暗金質感發光主按鈕 */
    .btn-play-main {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #f5e5c9 0%, #c59b27 100%);
      color: #120e1a;
      border-radius: 50%;
      opacity: 1;
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.4),
        0 0 14px rgba(212, 175, 55, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .btn-play-main:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #ffffff 0%, #dfb235 100%);
      box-shadow: 
        0 6px 20px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(255, 215, 0, 0.8);
    }

    .btn-play-main svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="player-card">

    <audio id="audioPlayer" src="https://archive.org/serve/1._20260804/1.%20%E4%B8%AD%E6%96%87%20%E6%AD%A1%E8%BF%8E%E4%BE%86%E5%88%B0%E5%8D%81%E9%BC%93%E6%96%87%E5%89%B5%E5%9C%92%E5%8D%80.mp3" preload="metadata"></audio>

    <!-- 1. 進度條 -->
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>
    </div>

    <!-- 2. 三個核心控制按鈕 -->
    <div class="controls">
      <button class="btn" id="prevBtn" title="倒退 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="btn btn-play-main" id="playBtn" title="播放/暫停">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn" id="nextBtn" title="快進 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressArea = document.getElementById('progressArea');
    const progressFill = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const playSVG = '<path d="M8 5v14l11-7z"/>';
    const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.innerHTML = pauseSVG;
        }).catch(err => {
          console.error("播放發生錯誤：", err);
        });
      } else {
        audio.pause();
        playIcon.innerHTML = playSVG;
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
      }
    });

    progressArea.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressArea.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    });

    prevBtn.addEventListener('click', () => audio.currentTime -= 10);
    nextBtn.addEventListener('click', () => audio.currentTime += 10);
  </script>
</body>
</html>
