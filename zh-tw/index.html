<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 音樂播放器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 10px;
            color: #2d3436;
            font-size: 1.5rem;
        }
        p {
            color: #636e72;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="icon">🎵</div>
        <h2>景點</h2>
        <p>享受美好的音樂時光</p>
        
        <!-- HTML5 音樂播放器核心 -->
        <!-- controls: 顯示播放控制列 -->
        <!-- loop: 音樂結束時自動重播 (選填) -->
        <audio controls loop>
            <source src="https://drive.google.com/file/d/1JzzqKmChmL1S-d6zi0qYThB1OLAJRUIi/view?usp=drive_link" type="audio/mpeg">
            您的瀏覽器不支援 HTML5 音頻元素。
        </audio>
    </div>

</body>
</html>
