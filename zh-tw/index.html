<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive.org 黑膠囊整合版</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f5;
      font-family: -apple-system, sans-serif;
      margin: 0;
    }

    /* 💡 用膠囊外框把 iframe 包起來 */
    .capsule-wrapper {
      background-color: #212121; /* 極暗灰背景 */
      padding: 12px 20px;
      border-radius: 30px; /* 大圓角膠囊感 */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 調整 iframe 樣式，使其無縫嵌入 */
    .capsule-wrapper iframe {
      border: none;
      border-radius: 12px;
      /* 混合模式：可讓部分背景更融入 */
      filter: invert(0.9) hue-rotate(180deg); /* 選擇性：將原生淺色播放器反轉成深色系 */
    }
  </style>
</head>
<body>

  <div class="capsule-wrapper">
    <iframe 
      src="https://archive.org/embed/1._20260804" 
      width="450" 
      height="30" 
      frameborder="0" 
      webkitallowfullscreen="true" 
      mozallowfullscreen="true" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
