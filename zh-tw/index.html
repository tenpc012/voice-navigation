<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十鼓導覽 - 三鍵極簡黑膠囊播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    /* 極黑膠囊外框 */
    .player-card {
      width: 100%;
      max-width: 380px; /* 控制按鈕減少後，稍微縮窄一點會更精緻 */
      background-color: #212121;
      border-radius: 28px;
      padding: 24px 28px 20px 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂部極細進度條 */
    .progress-area {
      width: 100%;
      cursor: pointer;
      padding: 6px 0;
    }

    .progress-bar-bg {
      width: 100%;
      height: 2px;
      background-color: rgba(255, 255, 255, 0.25);
      position: relative;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #ffffff;
      position: relative;
    }

    .progress-handle {
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    /* 三鍵控制按鈕列 (使用 flex 均分佈局) */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 0 20px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
      transition: all 0.2s ease;
    }

    .btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 中間實心白色圓形播放鍵 */
    .btn-play-main {
      width: 50px;
      height: 50px;
      background-color: #ffffff;
      color: #212121;
      border-radius: 50%;
      opacity: 1;
    }

    .btn-play-main:hover {
      transform: scale(1.06);
      background-color: #f0f0f0;
    }

    .btn-play-main svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="player-card">

    <!-- 💡 已解析出的真實 Archive.org MP3 直連網址 -->
    <audio id="audioPlayer" src="https://archive.org/serve/1._20260804/1.%20%E4%B8%AD%E6%96%87%20%E6%AD%A1%E8%BF%8E%E4%BE%86%E5%88%B0%E5%8D%81%E9%BC%93%E6%96%87%E5%89%B5%E5%9C%92%E5%8D%80.mp3" preload="metadata"></audio>

    <!-- 1. 進度條 -->
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>
    </div>

    <!-- 2. 精簡為三個核心按鈕 -->
    <div class="controls">
      <!-- 倒退 10 秒 -->
      <button class="btn" id="prevBtn" title="倒退 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- 中間主播放鍵 -->
      <button class="btn btn-play-main" id="playBtn" title="播放/暫停">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- 快進 10 秒 -->
      <button class="btn" id="nextBtn" title="快進 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressArea = document.getElementById('progressArea');
    const progressFill = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const playSVG = '<path d="M8 5v14l11-7z"/>';
    const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // 播放 / 暫停
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.innerHTML = pauseSVG;
        }).catch(err => {
          console.error("播放發生錯誤：", err);
        });
      } else {
        audio.pause();
        playIcon.innerHTML = playSVG;
      }
    });

    // 自動更新進度條
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
      }
    });

    // 點擊進度條跳轉時間
    progressArea.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressArea.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    });

    // 快進 / 倒退 10 秒
    prevBtn.addEventListener('click', () => audio.currentTime -= 10);
    nextBtn.addEventListener('click', () => audio.currentTime += 10);
  </script>
</body>
</html>
