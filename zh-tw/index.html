<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十鼓導覽 - 奇幻文創膠囊播放器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 全頁背景：沉穩暗色，凸顯播放器的主體光彩 */
      background-color: #0f0d13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    /* 🔮 奇幻文創風黑膠囊外框 */
    .player-card {
      width: 100%;
      max-width: 380px;
      
      /* 多層漸層與魔法微光濾鏡：深紫過渡至復古金銅 */
      background: 
        radial-gradient(circle at 20% 20%, rgba(147, 112, 219, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.12), transparent 50%),
        linear-gradient(135deg, #181226 0%, #241a2e 50%, #1e1713 100%);
      
      border-radius: 32px;
      padding: 24px 28px 20px 28px;
      
      /* 魔法邊框與複合陰影 */
      border: 1px solid rgba(212, 175, 55, 0.25); /* 細緻古銅金邊框 */
      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(138, 43, 226, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.1);
      
      display: flex;
      flex-direction: column;
      gap: 22px;
      backdrop-filter: blur(8px); /* 玻璃霧面濾鏡感 */
    }

    /* 頂部極細進度條 */
    .progress-area {
      width: 100%;
      cursor: pointer;
      padding: 6px 0;
    }

    .progress-bar-bg {
      width: 100%;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
    }

    /* 進度條發光金紫漸層 */
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #9b51e0, #f2c94c);
      border-radius: 2px;
      position: relative;
      box-shadow: 0 0 8px rgba(242, 201, 76, 0.5);
    }

    .progress-handle {
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      background-color: #fff8e7;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(242, 201, 76, 0.8);
    }

    /* 控制按鈕列 */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 0 16px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #e2d8ee;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: all 0.25s ease;
    }

    .btn:hover {
      opacity: 1;
      color: #fce38a;
      transform: scale(1.12);
      filter: drop-shadow(0 0 6px rgba(252, 227, 138, 0.4));
    }

    .btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* 中間魔法金色發光主按鈕 */
    .btn-play-main {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #f3e7e1 0%, #dad2c9 100%);
      color: #1a102f;
      border-radius: 50%;
      opacity: 1;
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.3),
        0 0 12px rgba(242, 201, 76, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .btn-play-main:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #ffffff 0%, #e6ded6 100%);
      box-shadow: 
        0 6px 20px rgba(0, 0, 0, 0.4),
        0 0 18px rgba(242, 201, 76, 0.6);
    }

    .btn-play-main svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="player-card">

    <audio id="audioPlayer" src="https://archive.org/serve/1._20260804/1.%20%E4%B8%AD%E6%96%87%20%E6%AD%A1%E8%BF%8E%E4%BE%86%E5%88%B0%E5%8D%81%E9%BC%93%E6%96%87%E5%89%B5%E5%9C%92%E5%8D%80.mp3" preload="metadata"></audio>

    <!-- 1. 進度條 -->
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>
    </div>

    <!-- 2. 精簡為三個核心按鈕 -->
    <div class="controls">
      <!-- 倒退 10 秒 -->
      <button class="btn" id="prevBtn" title="倒退 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- 中間主播放鍵 -->
      <button class="btn btn-play-main" id="playBtn" title="播放/暫停">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- 快進 10 秒 -->
      <button class="btn" id="nextBtn" title="快進 10 秒">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

  </div>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progressArea = document.getElementById('progressArea');
    const progressFill = document.getElementById('progressFill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const playSVG = '<path d="M8 5v14l11-7z"/>';
    const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // 播放 / 暫停
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          playIcon.innerHTML = pauseSVG;
        }).catch(err => {
          console.error("播放發生錯誤：", err);
        });
      } else {
        audio.pause();
        playIcon.innerHTML = playSVG;
      }
    });

    // 自動更新進度條
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
      }
    });

    // 點擊進度條跳轉時間
    progressArea.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressArea.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      audio.currentTime = (clickX / rect.width) * audio.duration;
    });

    // 快進 / 倒退 10 秒
    prevBtn.addEventListener('click', () => audio.currentTime -= 10);
    nextBtn.addEventListener('click', () => audio.currentTime += 10);
  </script>
</body>
</html>
