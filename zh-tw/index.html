<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文創風 HTML5 音樂播放器</title>
    <!-- 引入 Google Fonts 明體/襯線體，營造人文與書卷氣息 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F0EA;       /* 燕麥米沙色背景 */
            --card-bg: #FAF8F5;        /* 柔和奶油白卡片 */
            --primary-text: #2C2C2A;   /* 深墨灰標題 */
            --secondary-text: #7A7571; /* 煙灰次要文字 */
            --accent-color: #C06C4C;   /* 陶土赭紅點綴色 */
            --sage-green: #4A5B4C;     /* 靜謐苔綠 */
            --border-color: #E8E3DC;   /* 細緻邊框色 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
            background-color: var(--bg-color);
            /* 點狀紙張紋理微效果 */
            background-image: radial-gradient(#E5DFD5 1px, transparent 1px);
            background-size: 24px 24px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-text);
        }

        .player-card {
            background: var(--card-bg);
            padding: 36px 28px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(60, 50, 40, 0.06);
            text-align: center;
            width: 330px;
            transition: all 0.3s ease;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 16px;
            display: inline-block;
            color: var(--sage-green);
            background: #EFEBE4;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        h2 {
            margin-bottom: 8px;
            color: var(--primary-text);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            color: var(--secondary-text);
            font-size: 0.88rem;
            margin-bottom: 24px;
            letter-spacing: 1px;
            font-style: italic;
        }

        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
            /* 調整原生播放器濾鏡，使其顏色更融入暖色調背景 */
            filter: sepia(20%) opacity(90%);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="icon">🎧</div>
        <h2>我的音樂播放器</h2>
        <p>享受美好的音樂時光</p>
        
        <!-- HTML5 音樂播放器核心 -->
        <!-- controls: 顯示播放控制列 -->
        <!-- loop: 音樂結束時自動重播 (選填) -->
        <audio controls loop>
            <source src="https://docs.google.com/uc?export=open&id=1JzzqKmChmL1S-d6zi0qYThB1OLAJRUIi" type="audio/mpeg">
            您的瀏覽器不支援 HTML5 音頻元素。
        </audio>
    </div>

</body>
</html>
